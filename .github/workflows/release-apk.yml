name: Release Hyrule Companion APK and announce update

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
     
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate version tag and catalogue
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_catalog.py
          VERSION_CODE=$(sed -n 's/^[[:space:]]*versionCode = \([0-9]*\)$/\1/p' app/build.gradle.kts)
          VERSION_NAME=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"$/\1/p' app/build.gradle.kts)
          test "${GITHUB_REF_NAME}" = "v${VERSION_NAME}" || { echo "Git tag must equal v${VERSION_NAME}"; exit 1; }
          test -n "$VERSION_CODE" && test -n "$VERSION_NAME"
          echo "HC_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "HC_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
      - name: Configure release signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.HC_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "Missing HC_KEYSTORE_BASE64 secret"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hyrule-release.jks"
          echo "HC_KEYSTORE_PATH=$RUNNER_TEMP/hyrule-release.jks" >> "$GITHUB_ENV"
      - name: Assemble signed release APK
        env:
          HC_KEYSTORE_PASSWORD: ${{ secrets.HC_KEYSTORE_PASSWORD }}
          HC_KEY_ALIAS: ${{ secrets.HC_KEY_ALIAS }}
          HC_KEY_PASSWORD: ${{ secrets.HC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$HC_KEYSTORE_PASSWORD" && test -n "$HC_KEY_ALIAS" && test -n "$HC_KEY_PASSWORD"
          gradle :app:assembleRelease --no-daemon
          test -f app/build/outputs/apk/release/app-release.apk
      - name: Create public GitHub Release with signed APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ASSET="HyruleCompanion-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$ASSET"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ASSET" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$ASSET" \
              --title "Hyrule Companion ${HC_VERSION_NAME}" \
              --notes "Nova versão do Hyrule Companion: melhorias e correções."
          fi
          echo "HC_APK_URL=https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${ASSET}" >> "$GITHUB_ENV"
      - name: Notify devices through Supabase version catalogue
        env:
          HC_SUPABASE_URL: https://kramrknuxdkwxusskmrv.supabase.co
          HC_SUPABASE_SECRET_KEY: ${{ secrets.HC_SUPABASE_SECRET_KEY }}
          HC_RELEASE_NOTES: "Nova versão do Hyrule Companion: melhorias e correções."
        run: python3 .github/scripts/announce_release.py
